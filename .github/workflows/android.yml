name: Android build

# Manual runs (Actions tab -> Run workflow) and version tags like v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Secrets are mapped to env so steps can gate on their presence.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # API the released build points at. Set as a repo variable.
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      # Google Maps API key. build.gradle.kts reads this env var and injects it
      # into AndroidManifest as ${MAPS_API_KEY}; empty when the secret is unset,
      # so the map tiles simply won't load.
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - run: flutter pub get

      # Debug APK — always built, handy for quick install / testing.
      # Points at API_BASE_URL (repo variable) when set, else the default.
      - name: Build debug APK
        run: |
          if [ -n "$API_BASE_URL" ]; then
            flutter build apk --debug --dart-define=API_BASE_URL=$API_BASE_URL
          else
            flutter build apk --debug
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mileworth-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

      # Release APK — small (split per ABI), assertions stripped, directly
      # installable. When no Play signing secrets are set the build falls back to
      # debug signing (see android/app/build.gradle.kts), so this still produces
      # an installable APK for testers without configuring secrets.
      - name: Build release APK (split per ABI)
        run: |
          if [ -n "$API_BASE_URL" ]; then
            flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=$API_BASE_URL
          else
            flutter build apk --release --split-per-abi
          fi

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: mileworth-release-apks
          path: app/build/app/outputs/flutter-apk/*-release.apk

      # ---- Release AAB (only when signing secrets are configured) ----
      - name: Restore keystore + key.properties
        if: env.KEYSTORE_BASE64 != '' && env.KEY_PROPERTIES != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s' "$KEY_PROPERTIES" > android/key.properties

      # --obfuscate + --split-debug-info strip Dart symbols out of the binary,
      # shrinking the download and hardening the code. The stripped symbols are
      # uploaded separately so crash reports can still be de-obfuscated. The App
      # Bundle itself lets Play deliver only each device's CPU arch (~7-9 MB).
      - name: Build release AAB
        if: env.KEYSTORE_BASE64 != '' && env.KEY_PROPERTIES != ''
        run: |
          COMMON="--release --obfuscate --split-debug-info=build/symbols"
          if [ -n "$API_BASE_URL" ]; then
            flutter build appbundle $COMMON --dart-define=API_BASE_URL=$API_BASE_URL
          else
            flutter build appbundle $COMMON
          fi

      - name: Upload release AAB
        if: env.KEYSTORE_BASE64 != '' && env.KEY_PROPERTIES != ''
        uses: actions/upload-artifact@v4
        with:
          name: mileworth-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab

      - name: Upload de-obfuscation symbols
        if: env.KEYSTORE_BASE64 != '' && env.KEY_PROPERTIES != ''
        uses: actions/upload-artifact@v4
        with:
          name: mileworth-debug-symbols
          path: app/build/symbols

      # ---- Optional: push the debug APK to Firebase App Distribution ----
      - name: Distribute to Firebase testers
        if: env.FIREBASE_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: app/build/app/outputs/flutter-apk/app-debug.apk
